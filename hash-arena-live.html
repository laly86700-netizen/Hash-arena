<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ساحة هاش | الصدارة المباشرة</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f0f8f7;--card:#fff;--text:#0b2530;--muted:#52707a;--accent:#0d9488;--line:#e1e5f0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08171d;--card:#0f2730;--text:#e8f7f7;--muted:#8fb3b8;--accent:#14b8a6;--line:#1f3d48}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Tajawal","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center}
.wrap{width:100%;max-width:820px;padding:18px 16px 40px}
h1{text-align:center;font-size:30px;margin:6px 0 4px}
.st{text-align:center;color:var(--muted);font-size:14px;margin-bottom:16px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.rk{font-size:32px;width:52px;text-align:center}
.nm{flex:1;font-size:24px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{font-size:26px;font-weight:700;color:var(--accent)}
.tm{font-size:14px;color:var(--muted)}
.top{border:2px solid var(--accent);padding:20px 16px}
.top .nm{font-size:30px}.top .rk{font-size:42px}
button{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:transparent;color:var(--muted);border:2px solid var(--line);cursor:pointer}
.x{padding:2px 8px;font-size:18px}
.tools{display:flex;gap:8px;justify-content:center;margin-top:14px}
.empty{text-align:center;color:var(--muted);padding:30px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🏆 الصدارة المباشرة</h1>
  <div class="st" id="st">جارٍ الاتصال…</div>
  <div id="list"></div>
  <div class="tools"><button id="fs">ملء الشاشة ⛶</button><button id="clr">مسح الكل</button></div>
</div>
<script>
var DB_URL="https://hash-arena-b3e8a-default-rtdb.firebaseio.com";
var L=document.getElementById("list"),st=document.getElementById("st"),armed=false;
function draw(obj){
  var a=Object.keys(obj||{}).map(function(k){var v=obj[k];v.id=k;return v});
  a.sort(function(x,y){return y.s-x.s||(x.t||1e9)-(y.t||1e9)||x.ts-y.ts});
  L.textContent="";
  if(!a.length){var e=document.createElement("div");e.className="empty";e.textContent="بانتظار أول نتيجة… 📡";L.appendChild(e);return}
  var med=["🥇","🥈","🥉"];
  a.slice(0,10).forEach(function(p,i){
    var r=document.createElement("div");r.className="row"+(i<3?" top":"");
    var rk=document.createElement("div");rk.className="rk";rk.textContent=i<3?med[i]:String(i+1);
    var nm=document.createElement("div");nm.className="nm";nm.textContent=p.n;
    var tm=document.createElement("div");tm.className="tm";tm.textContent=p.t!=null?p.t+" ث":"";
    var sc=document.createElement("div");sc.className="sc";sc.textContent=p.s;
    var x=document.createElement("button");x.className="x";x.textContent="×";
    x.onclick=function(){fetch(DB_URL+"/scores/"+p.id+".json",{method:"DELETE"}).then(load)};
    r.appendChild(rk);r.appendChild(nm);r.appendChild(tm);r.appendChild(sc);r.appendChild(x);L.appendChild(r);
  });
}
function load(){
  if(!DB_URL){st.textContent="⚠️ لم يُضبط رابط قاعدة البيانات بعد";return}
  fetch(DB_URL+"/scores.json").then(function(r){return r.json()}).then(function(d){
    draw(d);st.textContent="🟢 مباشر · يتحدث كل ٣ ثواني";
  }).catch(function(){st.textContent="🔴 انقطع الاتصال، نحاول من جديد…"});
}
document.getElementById("fs").onclick=function(){var d=document.documentElement;if(d.requestFullscreen){d.requestFullscreen().catch(function(){})}};
var c=document.getElementById("clr");
c.onclick=function(){
  if(!armed){armed=true;c.textContent="اضغط مرة ثانية للتأكيد";setTimeout(function(){armed=false;c.textContent="مسح الكل"},3000);return}
  armed=false;c.textContent="مسح الكل";fetch(DB_URL+"/scores.json",{method:"DELETE"}).then(load);
};
load();setInterval(load,3000);
</script>
</body>
</html>
